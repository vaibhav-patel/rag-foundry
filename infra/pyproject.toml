[project]
name = "rag-foundry-infra"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = [
  "aws-cdk-lib>=2.170.0,<3",
  "constructs>=10.7.1,<11",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["rag_foundry_infra*"]
