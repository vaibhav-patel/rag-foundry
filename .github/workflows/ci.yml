name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install tooling
        run: pip install ruff pytest
      - name: Ruff
        run: ruff check services/control_plane services/workers/lambda_stub infra cli packages/contracts packages/sdk-python scripts
      - name: Format check
        run: ruff format --check services/control_plane services/workers/lambda_stub infra cli packages/contracts packages/sdk-python scripts

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install packages
        run: |
          pip install -e "infra/[dev]"
          pip install -e "services/control_plane/[dev]"
          pip install -e "packages/contracts"
          pip install -e "packages/sdk-python"
          pip install -e "cli/[dev]"
      - name: Pytest
        run: pytest -q

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: SBOM stub
        run: bash scripts/sbom.sh

  cdk-synth:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install CDK app
        run: pip install -e "infra/[dev]"
      - name: CDK synth
        env:
          CDK_DEFAULT_ACCOUNT: "000000000000"
          CDK_DEFAULT_REGION: us-east-1
        run: cd infra && python3 app.py

  web:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v6
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        run: npm ci --prefix web
      - name: Regenerate OpenAPI types
        run: npm run generate --prefix web
      - name: Fail on generated drift
        run: git diff --exit-code
      - name: Typecheck and build
        run: npm run build --prefix web
