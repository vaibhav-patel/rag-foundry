openapi: 3.0.3
info:
  title: rag-foundry Control Plane
  version: 0.1.0
paths:
  /v1/health:
    get:
      summary: Health check
      responses:
        "200":
          description: OK
  /v1/kbs:
    get:
      summary: List knowledge bases
      security: [{ bearerAuth: [] }]
    post:
      summary: Create knowledge base
      security: [{ bearerAuth: [] }]
  /v1/kbs/{kbId}/query:
    post:
      summary: RAG query (Bedrock generation + audit)
      security: [{ bearerAuth: [] }]
  /v1/kbs/{kbId}/search:
    post:
      summary: Dense / hybrid search (OpenSearch Serverless stub)
      security: [{ bearerAuth: [] }]
  /v1/kbs/{kbId}/uploads:
    post:
      summary: Presigned PUT for raw document
      security: [{ bearerAuth: [] }]
  /v1/kbs/{kbId}/jobs:
    post:
      summary: Start ingest job (Step Functions)
      security: [{ bearerAuth: [] }]
  /v1/jobs/{jobId}:
    get:
      summary: Poll job status
      security: [{ bearerAuth: [] }]
  /v1/plugins/manifest:
    post:
      summary: Register plugin manifest
      security: [{ bearerAuth: [] }]
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
