[project]
name = "rag-foundry-sdk-python"
version = "0.2.0"
requires-python = ">=3.9"
description = "Control-plane HTTP client and typed payloads for rag-foundry APIs."
readme = "README.md"
dependencies = []

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
