[project]
name = "rag-foundry-cli"
version = "0.1.0"
requires-python = ">=3.9"
dependencies = ["typer>=0.12.0", "httpx>=0.27.0"]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
rag-foundry = "rag_foundry_cli.main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
